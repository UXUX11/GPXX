<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS 座標轉 GPX 工具</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 20px; 
            background-color: #f5f5f7;
            color: #333;
        }
        h2 { color: #1d1d1f; }
        textarea { 
            width: 100%; 
            height: 250px; 
            margin-bottom: 10px; 
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-paste {
            background-color: #34c759;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            flex: 1;
        }
        .btn-clear {
            background-color: #ff3b30;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            flex: 1;
        }
        .btn-download { 
            background-color: #0071e3; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 8px;
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            width: 100%;
        }
        code { background-color: #e8e8ed; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .hint { color: #6e6e73; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>GPS 座標轉 GPX 檔案生成器</h2>
    <p class="hint">複製座標後，點擊下方綠色按鈕即可一鍵貼上並下載。</p>
    
    <textarea id="coordinates" placeholder="請在此貼上座標..."></textarea>
    
    <div class="btn-group">
        <button class="btn-paste" onclick="doPaste()">📋 一鍵貼上座標</button>
        <button class="btn-clear" onclick="document.getElementById('coordinates').value=''">🗑️ 清空內容</button>
    </div>
    
    <button class="btn-download" onclick="generateAndDownloadGPX()">產生並下載 GPX 檔</button>

    <script>
        // 電腦版保證成功的標準寫法
        function doPaste() {
            navigator.clipboard.readText()
                .then(text => {
                    if (text) {
                        document.getElementById('coordinates').value = text;
                    } else {
                        alert('你的剪貼簿裡好像沒有文字喔！');
                    }
                })
                .catch(err => {
                    alert('讀取失敗！請檢查瀏覽器網址左側的「鎖頭」圖示，確認是否有允許網頁「剪貼簿」權限。');
                });
        }

        function generateAndDownloadGPX() {
            const text = document.getElementById('coordinates').value;
            const regex = /([-+]?\d+\.\d+)[,\s]+([-+]?\d+\.\d+)/g;
            let matches;
            let wptElements = '';
            
            while ((matches = regex.exec(text)) !== null) {
                const lat = matches[1];
                const lon = matches[2];
                wptElements += `    <wpt lat="${lat}" lon="${lon}">\n        <name>WP1</name>\n    </wpt>\n`;
            }
            
            if (wptElements === '') {
                alert('找不到有效座標！');
                return;
            }
            
            const gpxContent = `<?xml version="1.0" encoding="UTF-8" ?>
<gpx>
    <iToolsData speed="260.0" link="https://www.thinkskysoft.com" loop="0">
        <rights>Copyright (c) 2018, thinkskysoft</rights>
    </iToolsData>
${wptElements}</gpx>`;
            
            const blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'route.gpx';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
