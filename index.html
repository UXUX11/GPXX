<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS 座標轉 GPX 工具</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 20px; 
            background-color: #f5f5f7;
            color: #333;
        }
        h2 { color: #1d1d1f; }
        textarea { 
            width: 100%; 
            height: 250px; 
            margin-bottom: 10px; 
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-paste {
            background-color: #8e8e93;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            flex: 1; /* 讓貼上按鈕佔用一部分空間 */
        }
        .btn-paste:hover { background-color: #707074; }
        .btn-download { 
            background-color: #0071e3; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 8px;
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            flex: 2; /* 讓下載按鈕寬一點 */
        }
        .btn-download:hover { background-color: #0077ed; }
        code { background-color: #e8e8ed; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .hint { color: #6e6e73; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>GPS 座標轉 GPX 檔案生成器</h2>
    <p class="hint">請在下方貼上座標（每行一組，格式如：<code>25.0339, 121.5645</code>）</p>
    
    <textarea id="coordinates" placeholder="12.87617, 78.98605&#10;12.87614, 78.98500&#10;12.87604, 78.98428"></textarea>
    
    <div class="btn-group">
        <button class="btn-paste" onclick="pasteCoordinates()">📋 貼上座標</button>
        <button class="btn-download" onclick="generateAndDownloadGPX()">產生並下載 GPX 檔</button>
    </div>

    <script>
        // 新增的貼上功能
        async function pasteCoordinates() {
            try {
                // 讀取剪貼簿的文字
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('coordinates').value = text;
                } else {
                    alert('剪貼簿裡面沒有文字喔！');
                }
            } catch (err) {
                alert('無法讀取剪貼簿，請手動貼上，或檢查是否未允許網頁權限。');
                console.error('無法讀取剪貼簿: ', err);
            }
        }

        function generateAndDownloadGPX() {
            const text = document.getElementById('coordinates').value;
            
            // 使用正則表達式抓取每行的經緯度數字
            const regex = /([-+]?\d+\.\d+)[,\s]+([-+]?\d+\.\d+)/g;
            let matches;
            let wptElements = '';
            
            // 循環比對所有符合的座標
            while ((matches = regex.exec(text)) !== null) {
                const lat = matches[1];
                const lon = matches[2];
                wptElements += `    <wpt lat="${lat}" lon="${lon}">\n        <name>WP1</name>\n    </wpt>\n`;
            }
            
            if (wptElements === '') {
                alert('找不到有效的座標，請檢查輸入格式是否正確！');
                return;
            }
            
            // 組裝成特定 GPX 格式
            const gpxContent = `<?xml version="1.0" encoding="UTF-8" ?>
<gpx>
    <iToolsData speed="260.0" link="https://www.thinkskysoft.com" loop="0">
        <rights>Copyright (c) 2018, thinkskysoft</rights>
    </iToolsData>
${wptElements}</gpx>`;
            
            // 建立下載動作
            const blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'route.gpx';
            document.body.appendChild(a);
            a.click();
            
            // 清理暫存
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </
